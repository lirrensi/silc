[project]
name = "silc"
version = "0.4.2"
description = "SILC - powerful tmux alternative | Shared interactive linked cmd that lets agents and humans peer into the same shell."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "textual>=0.44.0",
    "click>=8.1.7",
    "psutil>=5.9.6",
    "requests>=2.31.0",
    "platformdirs>=3.11.0",
    "pywebview>=6.1.0",
    "pywinpty>=3.0.2; sys_platform == 'win32'",
    "pytest-asyncio>=1.3.0",
    "pip>=25.3",
    "pytest>=9.0.2",
    "par-term-emu-core-rust>=0.20.0",
    "black>=26.1.0",
    "websockets>=12.0",
    "httpx>=0.28.1",
    "toml>=0.10.2",
    "aiofiles>=25.1.0",
    "mcp>=1.0.0",
    "pyee>=13.0.0",
]

[project.scripts]
silc = "silc.__main__:main"
silc-build-web = "silc.utils.build_web:main"
silc-test = "silc.utils.pytest_runner:main"

[project.optional-dependencies]
test = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.22.0",
]

[tool.hatch.build.targets.wheel]
packages = ["silc"]
include = ["static/manager/**/*", "static/scripts/**/*"]

[tool.hatch.build.hooks.custom]
path = "scripts/hatch_build.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "nuitka>=2.7.0",
    "zstandard>=0.23.0",
]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (require daemon)",
]
